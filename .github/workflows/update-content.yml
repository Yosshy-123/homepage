name: Update projects

on:
  schedule:
    # 15:00 UTC = 00:00 JST, once a day.
    - cron: '0 15 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-content
  cancel-in-progress: false

jobs:
  update-projects:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch pinned repos from GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Yosshy-123
        run: node scripts/update-content.mjs

      - name: Verify generated file type-checks
        run: npm run typecheck

      - name: Commit and push if content changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/projects.ts
          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi
          git commit -m "chore: sync projects from GitHub"
          git push || { git pull --rebase && git push; }
