name: Extract homepage-main ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_TOKEN }}

      - name: Extract ZIP safely
        run: |
          set -e

          unzip -o homepage-main.zip -d temp_extract
          rm -f homepage-main.zip

          rsync -a temp_extract/homepage-main/ .
          rm -rf temp_extract

      - name: Delete this workflow
        run: rm -f .github/workflows/unzip-homepage.yml

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Extract homepage-main.zip and remove workflow"
          git push origin HEAD:main
